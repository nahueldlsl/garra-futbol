<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Port web 1:1 de Garra Fútbol (Batovi Games Studio) en TypeScript, HTML5 Canvas 2D y Web Audio API."
    />
    <meta name="theme-color" content="#000000" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Garra Fútbol" />
    <meta
      property="og:description"
      content="Jugá al clásico Garra Fútbol directamente en tu navegador — 1P vs CPU, 1P vs 2P y Copa Calcar."
    />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>Garra Fútbol</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background-color: #000000;
        color: #ffffff;
        overflow: hidden;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #000000;
      }

      #game-canvas {
        display: block;
        width: min(100vw, calc(100vh * 4 / 3));
        height: min(100vh, calc(100vw * 3 / 4));
        max-width: 100vw;
        max-height: 100vh;
        background-color: #000000;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        outline: none;
      }

      #game-canvas.smooth {
        image-rendering: auto;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" width="800" height="600" tabindex="0"></canvas>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
